    <script>
        let documents = JSON.parse(localStorage.getItem('pilotDocuments')) || [];

        async function handleScan(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            document.getElementById('error-message').classList.add('hidden');

            showToast("Analyzing document... Please wait.", "bg-indigo-600");
            const btn = document.getElementById('scan-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Scanning...';
            btn.disabled = true;

            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(file);
                await worker.terminate();
                
                const text = ret.data.text;
                const textUpper = text.toUpperCase();
                
                let detectedName = null;
                // AI PRIORITY FIX: Medicals evaluated first
                if (textUpper.includes("CLASS-1") || textUpper.includes("CLASS 1") || textUpper.includes("MEDICAL ASSESSMENT")) detectedName = "Class 1 Medical";
                else if (textUpper.includes("CLASS-2") || textUpper.includes("CLASS 2")) detectedName = "Class 2 Medical";
                else if (textUpper.includes("RADIO TELEPHONY RESTRICTED") || textUpper.includes("RTR")) detectedName = "RTR(A)";
                else if (textUpper.includes("FLIGHT RADIO TELEPHONY") || textUpper.includes("FRTOL")) detectedName = "FRTOL";
                else if (textUpper.includes("LANGUAGE PROFICIENCY") || textUpper.includes("ELP") || textUpper.includes("LANGUAGE ASSESSMENT") || textUpper.includes("ENGLISH LANGUAGE") || textUpper.includes("OPERATIONAL LEVEL")) detectedName = "ELP (Language Proficiency)";
                else if (textUpper.includes("PASSPORT") || textUpper.includes("REPUBLIC OF INDIA")) detectedName = "Passport";
                else if (textUpper.includes("COMMERCIAL PILOT") || textUpper.includes("CPL")) detectedName = "CPL (Commercial Pilot License)";
                else if (textUpper.includes("PRIVATE PILOT") || textUpper.includes("PPL") || textUpper.includes("PRIVATE PILOT LICENCE")) detectedName = "PPL (Private Pilot License)";
                else if (textUpper.includes("STUDENT PILOT") || textUpper.includes("SPL")) detectedName = "SPL (Student Pilot License)";

                if (detectedName) {
                    document.getElementById('doc-name-select').value = detectedName;
                    document.getElementById('custom-doc-container').classList.add('hidden');
                }
                
                const regex = /(\d{1,2})[\s\-\/\.,]+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|0?[1-9]|1[0-2])[\s\-\/\.,]+(\d{4})/gi;
                let match;
                const dates = [];
                const months = { jan: '01', feb: '02', mar: '03', apr: '04', may: '05', jun: '06', jul: '07', aug: '08', sep: '09', oct: '10', nov: '11', dec: '12' };

                while ((match = regex.exec(text)) !== null) {
                    let day = match[1].padStart(2, '0');
                    let monthStr = match[2].toLowerCase();
                    let month = months[monthStr] ? months[monthStr] : monthStr.padStart(2, '0');
                    let year = match[3];
                    let parsedDate = new Date(`${year}-${month}-${day}`);
                    if (!isNaN(parsedDate)) dates.push(parsedDate);
                }

                if (dates.length > 0) {
                    const now = new Date();
                    const ageLimit = new Date();
                    
                    // PASSPORT FILTER FIX: Allow dates up to 15 years old
                    ageLimit.setFullYear(ageLimit.getFullYear() - 15);
                    const validDates = dates.filter(d => d > ageLimit);

                    if (validDates.length > 0) {
                        validDates.sort((a, b) => a - b);
                        
                        if (validDates.length === 1) {
                            if (detectedName === 'Passport') {
                                // Passport exactly 10 years rule
                                if (validDates[0] > now) {
                                    let calcIssue = new Date(validDates[0]);
                                    calcIssue.setFullYear(calcIssue.getFullYear() - 10);
                                    calcIssue.setDate(calcIssue.getDate() + 1);
                                    document.getElementById('expiry-date').value = validDates[0].toISOString().split('T')[0];
                                    document.getElementById('issue-date').value = calcIssue.toISOString().split('T')[0];
                                } else {
                                    let calcExpiry = new Date(validDates[0]);
                                    calcExpiry.setFullYear(calcExpiry.getFullYear() + 10);
                                    calcExpiry.setDate(calcExpiry.getDate() - 1);
                                    document.getElementById('issue-date').value = validDates[0].toISOString().split('T')[0];
                                    document.getElementById('expiry-date').value = calcExpiry.toISOString().split('T')[0];
                                }
                            } else if (detectedName === 'ELP (Language Proficiency)') {
                                // SMART ELP REGEX: Look for level over a larger string span
                                const levelMatch = text.match(/level.{0,25}?([456])/i);
                                let level = 4; 
                                if (levelMatch) level = parseInt(levelMatch[1]);
                                
                                let calcExpiry = new Date(validDates[0]);
                                if (level === 4) {
                                    calcExpiry.setFullYear(calcExpiry.getFullYear() + 3);
                                    calcExpiry.setDate(calcExpiry.getDate() - 1);
                                    document.getElementById('doc-remarks').value = "Level 4 (3 Years Validity)";
                                } else if (level === 5) {
                                    calcExpiry.setFullYear(calcExpiry.getFullYear() + 6);
                                    calcExpiry.setDate(calcExpiry.getDate() - 1);
                                    document.getElementById('doc-remarks').value = "Level 5 (6 Years Validity)";
                                } else if (level === 6) {
                                    calcExpiry.setFullYear(calcExpiry.getFullYear() + 50);
                                    document.getElementById('doc-remarks').value = "Level 6 (Lifetime Validity)";
                                }
                                
                                document.getElementById('issue-date').value = validDates[0].toISOString().split('T')[0];
                                document.getElementById('expiry-date').value = calcExpiry.toISOString().split('T')[0];
                            } else {
                                if (validDates[0] > now) document.getElementById('expiry-date').value = validDates[0].toISOString().split('T')[0];
                                else document.getElementById('issue-date').value = validDates[0].toISOString().split('T')[0];
                                autoCalculateExpiry();
                            }
                        } else {
                            // Standard scenario: Two dates found
                            document.getElementById('issue-date').value = validDates[0].toISOString().split('T')[0];
                            document.getElementById('expiry-date').value = validDates[validDates.length - 1].toISOString().split('T')[0];
                        }
                        
                        showToast("Dates & Info successfully extracted!", "bg-green-600");
                        autoCalculateExpiry();
                    } else {
                        showError("Found dates, but they seem too old. Please enter manually.");
                    }
                } else {
                    showError("Could not detect any clear dates. Please enter them manually.");
                }
            } catch (error) {
                showError("Scanning failed. Please try a clearer image.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
                event.target.value = ''; 
            }
        }

                if (currentExpiry !== newExpiryStr) {
                    document.getElementById('expiry-date').value = newExpiryStr;
